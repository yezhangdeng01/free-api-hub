name: ci

# PR 与 push 都跑一遍测试。
#
# 加这个是因为仓库原先只有 release.yml，触发条件仅 `push: tags: v*` ——
# 于是**任何 PR 都没有自动验证**，review 全凭人肉（PR #1 里的「187 passed」就是作者
# 本地跑出来的数字，无法交叉验证）。而测试是离线的，全部跑完只要几秒。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 与发版环境保持一致：pystray / pywebview / pythonnet 都有 Windows 专属依赖，
    # 换个系统装出来的依赖集都不一样
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: python -m pytest tests/ -q

      - name: 校验第三方许可清单与 requirements.txt 同步
        # 仓库里那份清单是给人 review 的副本（真正进包的那份由 release.yml 在打包时现生成），
        # 但它要是过期了没人会知道 —— 这里按 requirements.txt 重算一遍集合，对不上就红。
        # 只比依赖集合、不比版本号：requirements.txt 全是 `>=`，上游一发版版本号就变，
        # 拿版本号当失败条件会让 CI 周期性变红，而那并不说明清单错了。
        run: python scripts/gen_third_party_licenses.py --check
